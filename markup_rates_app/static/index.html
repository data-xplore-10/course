<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Markup Rates</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7385;
    --border: #dfe3ea; --accent: #2f6fde; --accent-text: #fff;
    --override: #eaf1ff; --danger: #c2372f; --ok: #1f8a4c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --panel: #1c2028; --text: #e6e9ef; --muted: #8d95a6;
      --border: #2d333f; --accent: #5b8ff0; --accent-text: #0d1117;
      --override: #1f2c45; --danger: #ef6b62; --ok: #4cc27f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  p.lead { margin: 0 0 20px; color: var(--muted); }
  section { background: var(--panel); border: 1px solid var(--border);
            border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { padding: 8px; border-bottom: 1px solid var(--border); text-align: left; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  input, select, button { font: inherit; color: inherit; }
  input, select { background: var(--panel); border: 1px solid var(--border);
                  border-radius: 6px; padding: 6px 8px; }
  input.rate { width: 72px; text-align: right; -moz-appearance: textfield; }
  input.rate::-webkit-inner-spin-button, input.rate::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  td.override input.rate { background: var(--override); border-color: var(--accent); }
  input.rate::placeholder { color: var(--muted); font-style: italic; }
  button { border: 1px solid var(--border); background: var(--panel);
           border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.link { border: none; background: none; color: var(--danger); padding: 4px; }
  button.clear { border: none; background: none; color: var(--muted); padding: 0 4px; width: 20px; }
  button.clear[hidden] { display: inline-block; visibility: hidden; }
  form.row, .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .legend { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px;
            background: var(--override); border: 1px solid var(--accent); vertical-align: -1px; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
           padding: 8px 14px; border-radius: 6px; background: var(--text); color: var(--bg);
           opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #toast.error { background: var(--danger); color: #fff; }
  .quote-result { margin-top: 12px; font-size: 14px; }
  .quote-result strong { font-size: 20px; color: var(--ok); }
</style>
</head>
<body>
<main>
  <h1>Customer Markup Rates</h1>
  <p class="lead">Set a default markup for each customer, then override it per product category where needed.</p>

  <section>
    <h2>Rates</h2>
    <div class="scroll">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="legend">
      Edit a value and press Enter or click away to save. Empty category cells inherit the default.
      <span class="swatch"></span> = category override.
    </div>
  </section>

  <section>
    <h2>Add customer</h2>
    <form id="add-form" class="row">
      <label>Name <input name="name" required placeholder="e.g. Umbrella Co"></label>
      <label>Default markup % <input name="default_markup" class="rate" type="number"
             min="0" max="500" step="0.01" value="25" required></label>
      <button class="primary" type="submit">Add</button>
    </form>
  </section>

  <section>
    <h2>Price calculator</h2>
    <form id="quote-form" class="row">
      <label>Customer <select name="customer_id" id="quote-customer"></select></label>
      <label>Category <select name="category" id="quote-category"></select></label>
      <label>Unit cost <input name="cost" type="number" min="0" step="0.01" value="100" required></label>
      <button class="primary" type="submit">Calculate</button>
    </form>
    <div id="quote-result" class="quote-result"></div>
  </section>
</main>
<div id="toast"></div>

<script>
let categories = [];
let customers = [];

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function toast(msg, isError = false) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "show" + (isError ? " error" : "");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => (el.className = ""), 2200);
}

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

function rateInput(value, placeholder, onSave) {
  const input = el("input", {
    className: "rate", type: "number", min: 0, max: 500, step: 0.01,
    value: value ?? "", placeholder: placeholder ?? "",
  });
  input.dataset.original = input.value;
  const save = () => {
    if (input.value === input.dataset.original) return;
    onSave(input.value.trim(), input);
  };
  input.addEventListener("change", save);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
  return input;
}

async function run(action, successMsg) {
  try {
    await action();
    if (successMsg) toast(successMsg);
  } catch (err) {
    toast(err.message, true);
  }
  await load();
}

function render() {
  document.getElementById("thead").replaceChildren(el("tr", {},
    el("th", { textContent: "Customer" }),
    el("th", { className: "num", textContent: "Default %" }),
    ...categories.map((c) => el("th", { className: "num", textContent: c + " %" })),
    el("th"),
  ));

  const rows = customers.map((cust) => {
    const defaultCell = el("td", { className: "num" }, rateInput(cust.default_markup, "", (v) =>
      run(() => api("PUT", `/api/customers/${cust.id}`, { default_markup: v }),
          `${cust.name}: default set to ${v}%`)));

    const catCells = categories.map((cat) => {
      const override = cust.overrides[cat];
      const td = el("td", { className: "num" + (override !== undefined ? " override" : "") });
      const path = `/api/customers/${cust.id}/rates/${encodeURIComponent(cat)}`;
      td.append(rateInput(override, cust.default_markup, (v) =>
        v === ""
          ? run(() => api("DELETE", path), `${cust.name}: ${cat} now uses default`)
          : run(() => api("PUT", path, { markup: v }), `${cust.name}: ${cat} set to ${v}%`)));
      // Always render the clear button (hidden when unused) so columns stay aligned.
      td.append(el("button", {
        className: "clear", title: "Clear override", textContent: "×",
        hidden: override === undefined,
        onclick: () => run(() => api("DELETE", path), `${cust.name}: ${cat} now uses default`),
      }));
      return td;
    });

    const del = el("button", {
      className: "link", textContent: "Delete",
      onclick: () => confirm(`Delete ${cust.name}?`) &&
        run(() => api("DELETE", `/api/customers/${cust.id}`), `Deleted ${cust.name}`),
    });

    return el("tr", {}, el("td", { textContent: cust.name }), defaultCell, ...catCells, el("td", {}, del));
  });

  if (!rows.length) {
    rows.push(el("tr", {}, el("td", {
      colSpan: categories.length + 3, textContent: "No customers yet — add one below.",
    })));
  }
  document.getElementById("tbody").replaceChildren(...rows);

  const qc = document.getElementById("quote-customer");
  const prev = qc.value;
  qc.replaceChildren(...customers.map((c) => el("option", { value: c.id, textContent: c.name })));
  if (customers.some((c) => String(c.id) === prev)) qc.value = prev;
}

async function load() {
  customers = await api("GET", "/api/customers");
  render();
}

document.getElementById("add-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const form = e.target;
  const body = Object.fromEntries(new FormData(form));
  run(async () => {
    await api("POST", "/api/customers", body);
    form.reset();
  }, `Added ${body.name}`);
});

document.getElementById("quote-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const out = document.getElementById("quote-result");
  const params = new URLSearchParams(new FormData(e.target));
  try {
    const q = await api("GET", "/api/quote?" + params);
    out.replaceChildren(
      el("strong", { textContent: `$${q.price}` }),
      ` — $${q.cost} cost + ${q.markup}% markup (${q.source}), margin $${q.margin}`,
    );
  } catch (err) {
    out.textContent = err.message;
  }
});

(async () => {
  categories = await api("GET", "/api/categories");
  document.getElementById("quote-category").replaceChildren(
    ...categories.map((c) => el("option", { value: c, textContent: c })));
  await load();
})();
</script>
</body>
</html>
